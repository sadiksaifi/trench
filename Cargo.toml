[package]
name = "trench"
version = "0.1.0"
edition = "2021"
description = "A fast, ergonomic, headless-first Git worktree manager"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "cargo"] }
clap_complete = "4"

# TUI
ratatui = "0.29"
crossterm = "0.28"
tui-spinner = "0.4.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"

# Async
tokio = { version = "1", features = ["full"] }

# Git
git2 = "0.19"

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Errors
anyhow = "1"
thiserror = "2"

# Serialization
serde_json = "1"

# Globs
globset = "0.4"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Watch
notify = "7"
shell-words = "1.1.1"
libc = "0.2"

[dev-dependencies]
serial_test = "3"
tempfile = "3.26.0"
